name: Digital Tribute CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-and-build:
    runs-on: macos-14

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: sudo xcode-select -s /Applications/Xcode_15.4.app || true

      - name: Run Digital Tribute Test Suite
        run: swift run DigiTributeTestRunner

      - name: Build Native Digital Tribute macOS & iOS App
        run: swift build --product DigiTributeApp

      - name: Validate Video Compilation Script
        run: python3 scripts/compile_memorial_video.py
