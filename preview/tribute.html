<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Digital Tribute — Memorial Recording</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-cream: #faf7f2;
      --gold-primary: #af893e;
      --gold-soft: #f5eedf;
      --gold-border: #e6dac1;
      --text-dark: #191714;
      --text-muted: #69635b;
      --border-subtle: #ece5d8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: var(--bg-cream);
      color: var(--text-dark);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .tribute-card {
      background: #ffffff;
      border: 1px solid var(--gold-border);
      border-radius: 24px;
      box-shadow: 0 16px 40px rgba(175, 137, 62, 0.12);
      max-width: 480px;
      width: 100%;
      padding: 36px 28px;
      text-align: center;
    }

    .memorial-badge {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.2px;
      background: var(--gold-soft);
      color: var(--gold-primary);
      padding: 4px 12px;
      border-radius: 20px;
      display: inline-block;
      margin-bottom: 20px;
    }

    .subject-header {
      font-family: 'Cormorant Garamond', serif;
      font-size: 26px;
      color: var(--text-dark);
      margin-bottom: 4px;
    }

    .dates {
      font-size: 13px;
      color: var(--text-muted);
      font-style: italic;
      margin-bottom: 24px;
    }

    .player-canvas {
      background: #181614;
      border-radius: 18px;
      padding: 24px;
      color: #fff;
      margin-bottom: 24px;
    }

    .waveform-bars {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 4px;
      height: 60px;
      margin: 16px 0;
    }

    .w-bar {
      width: 4px;
      background: var(--gold-primary);
      border-radius: 2px;
      height: 14px;
    }

    .playing .w-bar {
      animation: pulse 0.7s infinite alternate ease-in-out;
    }

    @keyframes pulse {
      0% { height: 8px; }
      100% { height: 48px; }
    }

    .btn-play {
      background: var(--gold-primary);
      color: white;
      border: none;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      font-size: 24px;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(175, 137, 62, 0.4);
      transition: all 0.2s;
    }

    .prompt-box {
      background: var(--gold-soft);
      border-radius: 12px;
      padding: 16px;
      font-size: 14.5px;
      font-weight: 600;
      color: #2b2416;
      margin-bottom: 18px;
      line-height: 1.5;
    }

    .contributor-meta {
      font-size: 14px;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <div class="tribute-card">
    <div class="memorial-badge">🕊️ Digital Tribute Keepsake Audio</div>
    <h2 class="subject-header">In Loving Memory of Eleanor Vance</h2>
    <div class="dates">March 14, 1948 — November 22, 2025</div>

    <div class="prompt-box" id="tribute-prompt">
      “What was an adventure only the two of you knew about?”
    </div>

    <div class="player-canvas">
      <div style="font-size: 13px; color: #d4af37; text-transform: uppercase; letter-spacing: 1px;">Voice Recording · 03:02</div>
      <div class="waveform-bars" id="waveform-wrap">
        <div class="w-bar" style="height: 18px;"></div>
        <div class="w-bar" style="height: 32px;"></div>
        <div class="w-bar" style="height: 48px;"></div>
        <div class="w-bar" style="height: 24px;"></div>
        <div class="w-bar" style="height: 52px;"></div>
        <div class="w-bar" style="height: 38px;"></div>
        <div class="w-bar" style="height: 20px;"></div>
        <div class="w-bar" style="height: 44px;"></div>
        <div class="w-bar" style="height: 16px;"></div>
      </div>
      <button class="btn-play" id="play-btn" onclick="togglePlay()">▶</button>
    </div>

    <div class="contributor-meta" id="contributor-tag">
      Shared by <strong>Martha Hayes</strong> (Childhood Friend)
    </div>
  </div>

  <script>
    let isPlaying = false;
    function togglePlay() {
      isPlaying = !isPlaying;
      const btn = document.getElementById('play-btn');
      const wave = document.getElementById('waveform-wrap');
      if (isPlaying) {
        btn.innerText = '⏸';
        wave.classList.add('playing');
      } else {
        btn.innerText = '▶';
        wave.classList.remove('playing');
      }
    }
  </script>
</body>
</html>
